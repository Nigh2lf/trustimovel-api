services:
  db:
    image: mysql:8.0
    container_name: trustimovel-mysql
    restart: unless-stopped
    # mysqlclient on Windows links against an older libmysqlclient that doesn't
    # speak MySQL 8's default caching_sha2_password auth, so new accounts use
    # the older (still secure over TCP-in-docker) mysql_native_password plugin.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
