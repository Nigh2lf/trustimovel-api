name: Deploy da API

# Todo push na main publica na EC2; o botão "Run workflow" repete o deploy sem commit novo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Prepara a chave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publica na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: /home/trustimovel-api
          GIT_SHA: ${{ github.sha }}
        run: |
          # O servidor baixa o commit do GitHub e roda o script versionado junto com o código.
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$APP_DIR' GIT_SHA='$GIT_SHA' bash -s" < scripts/deploy.sh
